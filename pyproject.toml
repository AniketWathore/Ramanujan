[project]
name = "ramanujan"
version = "0.1.0"
description = "Ramanujan v0.1 — Math Research Agent, kill-check slice"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "ramanuja", email = "ramanuja@ramanujan.local" }
]
license = { text = "MIT" }
keywords = ["math", "verification", "smt", "research-agent"]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "sympy>=1.12",
    "z3-solver>=4.12",
    "click>=8.1",
    "rich>=13",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
ramanujan-engine = "ramanujan.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ramanujan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["SIM102", "E501"]

[tool.ruff.format]
quote-style = "double"
